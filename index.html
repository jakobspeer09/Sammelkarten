<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1020">
<title>JCBS Heroes – Sammelkarten der BG11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap">
<style>
:root{--bg:#0b1020;--bg2:#141c38;--card:#18213f;--line:#2a3560;--txt:#f4f6fb;--mut:#9aa6c4;--red:#e63946;--red2:#ff5d6c;--gold:#f5c451;--ice:#9fd8ff;--green:#3ddc97;--amber:#ffb84d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;
 background-image:radial-gradient(circle at 20% -10%,#24305e 0,transparent 55%),radial-gradient(circle at 110% 30%,#3a1530 0,transparent 45%);background-attachment:fixed}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
h1,h2,.disp{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font-size:1.9rem;line-height:1.05;text-shadow:3px 3px 0 var(--red)}
.kicker{font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
section{margin-top:36px;scroll-margin-top:72px}
.sub{color:var(--mut);margin:6px 0 16px;font-size:.95rem}
/* Kopf */
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,16,32,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;color:var(--txt);text-decoration:none;font-size:.82rem;font-weight:600;padding:7px 13px;border-radius:99px;background:var(--bg2);border:1px solid var(--line)}
.nav a:active{transform:scale(.96)}
.hero{position:relative;padding:34px 0 8px;text-align:center}
.burst{position:absolute;left:50%;top:18px;width:300px;height:300px;transform:translateX(-50%);z-index:-1;opacity:.55;
 background:repeating-conic-gradient(from 0deg,rgba(245,196,81,.22) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 60s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.hero h1{font-size:3.6rem;line-height:.92;text-shadow:4px 4px 0 var(--red),8px 8px 0 rgba(0,0,0,.35)}
.hero h1 span{display:block;color:var(--gold);font-size:2.1rem}
.hero p{color:var(--mut);margin:12px auto 0;max-width:340px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:6px 12px;border-radius:99px;background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.5);color:#ffd6da;font-size:.8rem;font-weight:600}
/* Code-Suche */
.scan{position:relative;padding:20px;border-radius:24px;background:linear-gradient(160deg,#1d2752,#141c38);border:1px solid var(--line);overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.scan::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:9px 9px;pointer-events:none}
.scan>*{position:relative}
.code{display:flex;gap:10px;margin-top:14px}
.code input{flex:1;min-width:0;height:58px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:#0c1228;color:#fff;font:400 1.9rem Anton,Impact,sans-serif;letter-spacing:.35em;text-align:center}
.code input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,196,81,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:800 .95rem Inter,sans-serif;color:#fff;padding:0 18px;height:58px;border-radius:14px;background:linear-gradient(135deg,var(--red2),var(--red));box-shadow:0 6px 0 #9d1f2a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #9d1f2a}
.btn.sm{height:38px;padding:0 12px;font-size:.85rem;border-radius:10px;box-shadow:0 3px 0 #9d1f2a}
.btn.ghost{background:var(--bg2);border:1px solid var(--line);box-shadow:none}
.hint{font-size:.8rem;color:var(--mut);margin-top:10px}
.msg{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.4);font-size:.9rem}
/* Sammelkarte */
.result{margin-top:18px;display:grid;gap:16px}
.tcard{--rc:#9aa4b5;width:min(260px,78vw);aspect-ratio:63/88;margin:0 auto;padding:9px;border-radius:16px;background:var(--rc);box-shadow:0 0 0 2px rgba(255,255,255,.15),0 0 34px color-mix(in srgb,var(--rc) 55%,transparent);animation:reveal .7s cubic-bezier(.2,.9,.3,1.2) both;position:relative}
@keyframes reveal{from{transform:perspective(800px) rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.tc-in{height:100%;border-radius:10px;background:linear-gradient(#f8f1de,#ecdcb6);color:#2a2116;display:flex;flex-direction:column;padding:8px;gap:6px;overflow:hidden}
.tc-name{font:400 1.15rem Anton,sans-serif;text-align:center;background:linear-gradient(#fff6dc,#e9d29a);border:1px solid #bfa060;border-radius:6px;padding:2px 4px;text-transform:none}
.tc-img{flex:1;border-radius:8px;overflow:hidden;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 70%,#fff),color-mix(in srgb,var(--rc) 60%,#000));display:grid;place-items:center}
.tc-img img{width:100%;height:100%;object-fit:cover}
.tc-img svg{width:70%;opacity:.85}
.tc-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tc-box{background:#fff8e6;border:1px solid #c9ad72;border-radius:6px;padding:3px 6px;text-align:center;line-height:1.15}
.tc-box small{display:block;font-size:.55rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7a6440}
.tc-box b{font-size:.78rem}
.tc-foot{display:flex;justify-content:space-between;align-items:center;font-size:.62rem;font-weight:800;text-transform:uppercase;background:#2b2f45;color:#fff;border-radius:6px;padding:4px 7px}
.tc-foot .rs{color:var(--rc)}
.foil::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.75) 40%,transparent 55%);background-size:250% 100%;animation:shine 2.6s ease-in-out infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.rainbow{background:conic-gradient(from var(--a,0deg),#ff4d6d,#ffb84d,#f5e663,#3ddc97,#4dc3ff,#9b6bff,#ff4d6d)!important;animation:reveal .7s both,rot 4s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes rot{to{--a:360deg}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.fact small{display:block;color:var(--mut);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.fact b{font-size:1.1rem}
.fact.wide{grid-column:1/-1}
/* Stand / Bestand */
.live{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--green)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.items{display:grid;gap:12px}
.item{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden}
.item.epic{border-color:#7b52ff;background:linear-gradient(135deg,#251c52,var(--card) 60%)}
.ico{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;background:var(--bg2)}
.ico svg{width:40px;height:40px}
.item h3{margin:0;font-size:1rem;line-height:1.25}
.item p{margin:2px 0 0;font-size:.8rem;color:var(--mut)}
.price{font:400 1.35rem Anton,sans-serif;color:var(--gold);text-align:right;white-space:nowrap}
.pill{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:800}
.ok{background:rgba(61,220,151,.15);color:var(--green)}
.low{background:rgba(255,184,77,.16);color:var(--amber)}
.out{background:rgba(230,57,70,.18);color:#ff8a94}
.item.sold>*:not(.stamp){opacity:.4}
.stamp{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-12deg);font:400 1.05rem Anton,sans-serif;letter-spacing:.06em;color:var(--red2);border:3px solid var(--red2);border-radius:8px;padding:2px 8px;background:rgba(11,16,32,.6)}
.food{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fitem{position:relative;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden}
.fitem .pic{aspect-ratio:1;background:linear-gradient(135deg,#3b2414,#1f1510);display:grid;place-items:center}
.fitem .pic img{width:100%;height:100%;object-fit:cover}
.fitem .pic svg{width:56%}
.fitem .bd{padding:10px 12px 12px}
.fitem h3{margin:0;font-size:.92rem;line-height:1.25}
.fitem .price{text-align:left;font-size:1.15rem}
.fitem.sold .pic,.fitem.sold .bd{opacity:.4}
.fitem .stamp{top:38%;right:50%;transform:translate(50%,-50%) rotate(-12deg)}
.upd{font-size:.75rem;color:var(--mut);margin-top:10px;text-align:right}
/* Seltenheiten */
.rar{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);background:var(--rc);box-shadow:0 0 12px var(--rc)}
.dot.rainbow{border-radius:4px}
.rrow b{font-size:.95rem}
.rrow span{font-size:.82rem;color:var(--mut);text-align:right;min-width:52px}
.rhead{display:grid;grid-template-columns:14px 1fr auto auto;gap:12px;padding:0 14px;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.rhead span{min-width:52px;text-align:right}
/* Kategorien */
.kats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kat{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.kat::after{content:"";position:absolute;right:-18px;bottom:-18px;width:60px;height:60px;border-radius:50%;background:var(--kc);opacity:.25}
.kat b{display:block;font-size:.92rem}
.kat small{color:var(--mut);font-size:.75rem}
.bonus{margin-top:12px;padding:14px;border-radius:14px;border:1px dashed var(--gold);background:rgba(245,196,81,.07);font-size:.9rem}
/* Infos */
.info{display:grid;gap:10px}
.irow{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.irow svg{flex:none;width:26px;height:26px;color:var(--gold)}
.irow small{display:block;color:var(--mut);font-size:.75rem}
footer{margin-top:44px;text-align:center;color:var(--mut);font-size:.8rem}
footer .ft{user-select:none;-webkit-user-select:none;cursor:default;padding:10px}
/* Admin */
.adm{position:sticky;top:0;z-index:6;margin:0 -16px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--gold);color:#1a1300;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.85rem;font-weight:800}
.adm button{border:0;border-radius:8px;padding:6px 10px;background:#1a1300;color:var(--gold);font:800 .8rem Inter,sans-serif}
.ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.ctl input,.ctl select{height:38px;border-radius:10px;border:1px solid var(--line);background:#0c1228;color:#fff;padding:0 8px;font:600 .9rem Inter,sans-serif}
.ctl input[type=number]{width:72px}
.ctl label{font-size:.72rem;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.fitem .ctl{padding:10px 12px 12px;border-top:1px dashed var(--line)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,18,.75);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.mbox{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px}
.mbox input{width:100%;height:46px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:#0c1228;color:#fff;padding:0 12px;font:16px Inter,sans-serif}
.mbox .row{display:flex;gap:10px;margin-top:16px}
.mbox .row .btn{flex:1;height:46px}
.demo{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(159,216,255,.1);border:1px solid rgba(159,216,255,.35);font-size:.8rem;color:var(--ice)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main id="app"></main>
<script>
"use strict";
/* ============ KONFIGURATION (hier anpassen) ============ */
const CFG={
  url:"https://rpasuowcpxqyaqhlwyrl.supabase.co",      // Supabase Project URL
  key:"sb_publishable_Ux2W7T7Ba4pMtyW4HSZQfQ_aKx5QU5T",                   // Supabase publishable/anon key (darf öffentlich sein)
  titel:"JCBS", titel2:"Heroes",
  untertitel:"Die Lehrer- und Mitarbeiter-Sammelkarten der BG11",
  ort:"Klassenzimmer XXX", zeit:"Weihnachtsmarkt 2026 · Uhrzeit folgt",
  poll:20000                                    // Bestand alle 20 s neu laden
};
// Seltenheiten: Chancen sind Platzhalter (normal = normales Pack, episch = episches Pack)
const RAR=[
  {id:"common",   name:"Common",    col:"#9aa4b5", stars:1, normal:"55 %", episch:"25 %"},
  {id:"rare",     name:"Rare",      col:"#3d8bff", stars:2, normal:"25 %", episch:"30 %"},
  {id:"epic",     name:"Epic",      col:"#9b6bff", stars:3, normal:"12 %", episch:"22 %"},
  {id:"legendary",name:"Legendary", col:"#ff8c2b", stars:4, normal:"5 %",  episch:"13 %"},
  {id:"gold",     name:"Gold",      col:"#f5c451", stars:5, normal:"2 %",  episch:"7 %"},
  {id:"rainbow",  name:"Rainbow",   col:"#ff4d6d", stars:5, normal:"1 %",  episch:"3 %"}
];
// Kategorien (Sammelalbum-Seiten)
const KAT=[
  {id:"kombi",name:"Kombi-Zug",col:"#3ddc97"},{id:"rs",name:"Realschule",col:"#e63946"},
  {id:"gym",name:"Gymnasium",col:"#3d8bff"},{id:"bg",name:"Berufliches Gymnasium",col:"#9b6bff"},
  {id:"it",name:"IT",col:"#4dc3ff"},{id:"haus",name:"Hausmeister",col:"#ffb84d"},
  {id:"verw",name:"Verwaltung",col:"#f5c451"},{id:"seel",name:"Schulseelsorge",col:"#ff7eb6"}
];
const BONUS="Wer eine Kategorie komplett gesammelt hat, bekommt an unserem Stand eine exklusive Bonuskarte.";
/* ======================================================= */

const DEMO=CFG.url.includes("DEIN-PROJEKT");
const DEMO_STOCK=[
 {id:"album",grp:"stand",name:"Sammelalbum",info:"Mit Seiten für alle Kategorien",price:3,qty:42,mode:"exact",sort:1},
 {id:"pack",grp:"stand",name:"Mystery-Pack",info:"5 zufällige Karten",price:2,qty:118,mode:"exact",sort:2},
 {id:"pack_epic",grp:"stand",name:"Episches Mystery-Pack",info:"5 Karten, mindestens 1× Epic oder besser",price:4,qty:7,mode:"exact",sort:3},
 {id:"zimt_klassik",grp:"food",name:"Zimtschnecke Klassik",price:2.5,qty:64,mode:"approx",sort:10},
 {id:"zimt_schoko",grp:"food",name:"Schoko-Schnecke",price:3,qty:31,mode:"approx",sort:11},
 {id:"zimt_apfel",grp:"food",name:"Apfel-Zimt-Schnecke",price:3,qty:9,mode:"approx",sort:12},
 {id:"zimt_vanille",grp:"food",name:"Vanille-Schnecke",price:3,qty:0,mode:"approx",sort:13}
];
const DEMO_CARDS={
 "111111":{name:"Hr. Muster",bereich:"Mathe & Physik",kat:"gym",rarity:"common",auflage:40},
 "222222":{name:"Fr. Beispiel",bereich:"Deutsch & Musik",kat:"rs",rarity:"rare",auflage:20},
 "333333":{name:"Hr. Platzhalter",bereich:"Schulseelsorge",kat:"seel",rarity:"epic",auflage:10},
 "444444":{name:"Fr. Test",bereich:"Informatik",kat:"it",rarity:"legendary",auflage:5},
 "555555":{name:"Hr. Hausmeister",bereich:"Alles, was klemmt",kat:"haus",rarity:"gold",auflage:3},
 "777777":{name:"Fr. Direktorin",bereich:"Schulleitung",kat:"verw",rarity:"rainbow",auflage:1}
};

const S={stock:[],upd:null,card:null,err:"",busy:false,tok:null,admin:false,login:false,loginErr:"",taps:0,tapT:0};
const $=s=>document.querySelector(s);
const E=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>Number(n||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const rarOf=id=>RAR.find(r=>r.id===id)||RAR[0];
const katOf=id=>KAT.find(k=>k.id===id)||{name:id||"–",col:"#9aa4b5"};

/* ---------- Supabase (REST, keine Bibliothek) ---------- */
async function api(path,{method="GET",body,auth=false,prefer}={}){
  const h={apikey:CFG.key,"Content-Type":"application/json"};
  if(auth){await ensureTok();h.Authorization="Bearer "+S.tok.access_token;}
  if(prefer)h.Prefer=prefer;
  const r=await fetch(CFG.url+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const t=await r.text();const d=t?JSON.parse(t):null;
  if(!r.ok)throw new Error((d&&(d.message||d.error_description||d.msg))||("Fehler "+r.status));
  return d;
}
function saveTok(d){S.tok={access_token:d.access_token,refresh_token:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000};try{localStorage.setItem("jcbs-tok",JSON.stringify(S.tok))}catch(e){}}
async function ensureTok(){
  if(!S.tok)throw new Error("Nicht angemeldet");
  if(S.tok.exp-60000>Date.now())return;
  const r=await fetch(CFG.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.tok.refresh_token})});
  if(!r.ok){logout();throw new Error("Sitzung abgelaufen, bitte neu anmelden");}
  saveTok(await r.json());
}
async function login(email,pw){
  if(DEMO){S.tok={demo:1};S.admin=true;return;}
  const r=await fetch(CFG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const m=String(d.error_code||d.msg||d.error_description||d.error||"");
    throw new Error(/confirm/i.test(m)?"E-Mail ist noch nicht bestätigt":/invalid/i.test(m)?"E-Mail oder Passwort falsch":"Anmeldung fehlgeschlagen ("+(m||r.status)+")");}
  saveTok(d);
  S.admin=await api("/rest/v1/rpc/is_admin",{method:"POST",body:{},auth:true})===true;
  if(!S.admin){logout();throw new Error("Dieses Konto ist kein Admin");}
}
function logout(){S.tok=null;S.admin=false;try{localStorage.removeItem("jcbs-tok")}catch(e){}render();}

async function loadStock(){
  try{
    if(DEMO){let l=null;try{l=JSON.parse(localStorage.getItem("jcbs-demo")||"null")}catch(e){}S.stock=l||DEMO_STOCK.map(x=>({...x}));}
    else S.stock=await api("/rest/v1/stock?select=id,grp,name,info,price,qty,mode,sort,img&order=sort");
    S.upd=new Date();S.stockErr="";
  }catch(e){S.stockErr="Bestand konnte gerade nicht geladen werden.";}
  renderStock();
}
async function lookup(code){
  if(DEMO){const c=DEMO_CARDS[code];return c?{code,...c}:null;}
  return await api("/rest/v1/rpc/lookup_card",{method:"POST",body:{p_code:code}});
}
async function saveItem(id,patch){
  if(DEMO){const it=S.stock.find(x=>x.id===id);Object.assign(it,patch);try{localStorage.setItem("jcbs-demo",JSON.stringify(S.stock))}catch(e){}return;}
  const d=await api("/rest/v1/stock?id=eq."+encodeURIComponent(id),{method:"PATCH",body:patch,auth:true,prefer:"return=representation"});
  if(!d||!d.length)throw new Error("Keine Berechtigung");
}
async function adjust(id,delta){
  if(DEMO){const it=S.stock.find(x=>x.id===id);return saveItem(id,{qty:Math.max(0,it.qty+delta)});}
  await api("/rest/v1/rpc/adjust_stock",{method:"POST",body:{p_id:id,p_delta:delta},auth:true});
}

/* ---------- Bestandsanzeige ---------- */
function status(it){
  const q=it.qty|0;
  if(q<=0)return {cls:"out",txt:"Ausverkauft",sold:true};
  if(it.mode==="approx"){
    if(q>50)return {cls:"ok",txt:"Noch mehr als 50"};
    if(q>20)return {cls:"ok",txt:"Noch mehr als 20"};
    return {cls:"low",txt:"Nur noch wenige"};
  }
  return {cls:q<=10?"low":"ok",txt:q===1?"Nur noch 1 übrig":`Noch ${q} übrig`};
}
function ctl(it){
  if(!S.admin)return "";
  return `<div class="ctl" data-id="${E(it.id)}">
   <button class="btn sm ghost" data-a="dec">−1</button><button class="btn sm ghost" data-a="inc">+1</button>
   <label>Anzahl<input type="number" min="0" inputmode="numeric" value="${it.qty|0}" data-f="qty"></label>
   <label>Preis €<input type="number" min="0" step="0.1" inputmode="decimal" value="${Number(it.price)}" data-f="price"></label>
   <label>Anzeige<select data-f="mode"><option value="exact"${it.mode==="exact"?" selected":""}>genau</option><option value="approx"${it.mode==="approx"?" selected":""}>ungefähr</option></select></label>
   <button class="btn sm" data-a="save">Speichern</button></div>`;
}
function renderStock(){
  const box=$("#stock");if(!box)return;
  if(S.admin&&document.activeElement&&document.activeElement.matches(".ctl input,.ctl select")&&!S.force)return;S.force=false; // Admin tippt gerade: nicht überschreiben
  const st=S.stock.filter(x=>x.grp==="stand"),fd=S.stock.filter(x=>x.grp==="food");
  const stamp=s=>s.sold?'<div class="stamp">Ausverkauft</div>':"";
  box.innerHTML=(S.stockErr?`<div class="msg">${E(S.stockErr)}</div>`:"")+
  `<div class="items">${st.map(it=>{const s=status(it);return `
   <div class="item${it.id.includes("epic")?" epic":""}${s.sold&&!S.admin?" sold":""}">
    <div class="ico">${IC[it.id]||IC.pack}</div>
    <div><h3>${E(it.name)}</h3>${it.info?`<p>${E(it.info)}</p>`:""}<span class="pill ${s.cls}">${E(s.txt)}</span></div>
    <div class="price">${eur(it.price)}</div>${S.admin?ctl(it):stamp(s)}</div>`}).join("")}</div>
  <h3 class="kicker" style="margin:26px 0 12px">Zimtschnecken & Co.</h3>
  <div class="food">${fd.map(it=>{const s=status(it);return `
   <div class="fitem${s.sold&&!S.admin?" sold":""}">
    <div class="pic">${it.img?`<img src="${E(it.img)}" alt="${E(it.name)}" loading="lazy">`:IC.roll}</div>
    <div class="bd"><h3>${E(it.name)}</h3><div class="price">${eur(it.price)}</div><span class="pill ${s.cls}">${E(s.txt)}</span></div>
    ${S.admin?ctl(it):stamp(s)}</div>`}).join("")}</div>
  <div class="upd">${S.upd?"Stand: "+S.upd.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr":""}</div>`;
}

/* ---------- Karte ---------- */
function cardHTML(c){
  const r=rarOf(c.rarity),k=katOf(c.kat);
  const fx=r.id==="rainbow"?" rainbow foil":(["gold","legendary"].includes(r.id)?" foil":"");
  return `<div class="tcard${fx}" style="--rc:${r.col}"><div class="tc-in">
   <div class="tc-name">${E(c.name)}</div>
   <div class="tc-img">${c.img?`<img src="${E(c.img)}" alt="">`:IC.hero}</div>
   <div class="tc-row"><div class="tc-box"><small>Fächer / Bereich</small><b>${E(c.bereich||"–")}</b></div>
   <div class="tc-box"><small>Auflage</small><b>${E(c.auflage)}×</b></div></div>
   <div class="tc-foot"><span>${E(k.name)}</span><span class="rs">${"★".repeat(r.stars)} ${E(r.name)}</span></div></div></div>`;
}
function renderResult(){
  const box=$("#result");if(!box)return;
  if(S.err){box.innerHTML=`<div class="msg">${E(S.err)}</div>`;return;}
  const c=S.card;if(!c){box.innerHTML="";return;}
  const r=rarOf(c.rarity);
  box.innerHTML=cardHTML(c)+`<div class="facts">
   <div class="fact"><small>Seltenheit</small><b style="color:${r.col}">${E(r.name)}</b></div>
   <div class="fact"><small>Gibt es</small><b>${c.auflage==1?"nur 1×":"nur "+E(c.auflage)+"×"}</b></div>
   <div class="fact"><small>Chance normales Pack</small><b>${E(r.normal)}</b></div>
   <div class="fact"><small>Chance episches Pack</small><b>${E(r.episch)}</b></div>
   <div class="fact wide"><small>Kategorie</small><b>${E(katOf(c.kat).name)}</b></div></div>`;
}
async function check(){
  const inp=$("#code"),code=(inp.value||"").replace(/\D/g,"");
  S.card=null;S.err="";
  if(code.length!==6){S.err="Bitte genau 6 Ziffern eingeben.";renderResult();return;}
  if(S.busy)return;S.busy=true;
  try{const c=await lookup(code);if(c)S.card=c;else S.err="Diesen Code gibt es nicht. Bitte nochmal genau abtippen.";}
  catch(e){S.err="Prüfen gerade nicht möglich. Bitte gleich nochmal versuchen.";}
  S.busy=false;inp.blur();renderResult();
  $("#result").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- Seite ---------- */
function render(){
  $("#app").innerHTML=`
  ${S.admin?`<div class="adm"><span>Admin-Modus${DEMO?" (Demo)":""}</span><button data-a="logout">Abmelden</button></div>`:""}
  <div class="top"><nav class="nav"><a href="#karte">Karte prüfen</a><a href="#stand">Stand</a><a href="#selten">Seltenheiten</a><a href="#kategorien">Kategorien</a><a href="#infos">Infos</a></nav></div>
  <header class="hero"><div class="burst"></div>
   <div class="badge">★ Weihnachtsmarkt 2026</div>
   <h1>${E(CFG.titel)}<span>${E(CFG.titel2)}</span></h1>
   <p>${E(CFG.untertitel)}</p></header>

  <section id="karte"><div class="scan">
   <div class="kicker">Karte gezogen?</div><h2>Code eingeben</h2>
   <p class="sub" style="margin-bottom:0">Gib den 6-stelligen Code von deiner Karte ein und finde heraus, wie selten sie ist.</p>
   <form class="code" id="cform" autocomplete="off"><input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" aria-label="Kartencode">
   <button class="btn" type="submit">Prüfen</button></form>
   ${DEMO?`<div class="demo">Demo-Modus: Probier 111111, 222222, 333333, 444444, 555555 oder 777777.</div>`:""}
   <div class="result" id="result"></div></div></section>

  <section id="stand"><div class="kicker">Am Stand</div><h2>Noch verfügbar</h2>
   <p class="sub"><span class="live"><i></i>Live-Bestand</span></p><div id="stock"></div></section>

  <section id="selten"><div class="kicker">Wie selten?</div><h2>Seltenheiten</h2>
   <p class="sub">Je seltener, desto stärker glänzt die Karte. Chancen pro Karte im Pack:</p>
   <div class="rhead"><i></i><span style="text-align:left">Stufe</span><span>Normal</span><span>Episch</span></div>
   <div class="rar">${RAR.map(r=>`<div class="rrow"><div class="dot${r.id==="rainbow"?" rainbow":""}" style="--rc:${r.col}"></div><b>${"★".repeat(r.stars)} ${E(r.name)}</b><span>${E(r.normal)}</span><span>${E(r.episch)}</span></div>`).join("")}</div></section>

  <section id="kategorien"><div class="kicker">Sammelalbum</div><h2>Kategorien</h2>
   <p class="sub">Jede Karte gehört zu einer Kategorie. Sammle sie alle!</p>
   <div class="kats">${KAT.map(k=>`<div class="kat" style="--kc:${k.col}"><b>${E(k.name)}</b><small>Kategorie</small></div>`).join("")}</div>
   <div class="bonus">🎁 ${E(BONUS)}</div></section>

  <section id="infos"><div class="kicker">Komm vorbei</div><h2>Infos</h2>
   <div class="info" style="margin-top:14px">
    <div class="irow">${IC.pin}<div><small>Wo?</small><b>${E(CFG.ort)}</b></div></div>
    <div class="irow">${IC.clock}<div><small>Wann?</small><b>${E(CFG.zeit)}</b></div></div>
    <div class="irow">${IC.gift}<div><small>Tauschen</small><b>Doppelte Karten einfach untereinander tauschen</b></div></div>
   </div></section>

  <footer><div class="ft" id="ft">Eine Aktion der BG11 · Johann-Christoph-Blumhardt-Schule</div></footer>
  ${S.login?`<div class="modal" id="modal"><form class="mbox" id="lform">
   <h2 style="font-size:1.5rem">Admin-Login</h2>
   <input type="email" id="lmail" placeholder="E-Mail" autocomplete="username" required>
   <input type="password" id="lpw" placeholder="Passwort" autocomplete="current-password" required>
   ${S.loginErr?`<div class="msg">${E(S.loginErr)}</div>`:""}
   ${DEMO?`<div class="demo">Demo-Modus: beliebige Daten eingeben.</div>`:""}
   <div class="row"><button type="button" class="btn ghost" data-a="lclose">Abbrechen</button><button class="btn" type="submit">Anmelden</button></div></form></div>`:""}`;
  renderStock();renderResult();
}

/* ---------- Ereignisse ---------- */
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="cform")return check();
  if(e.target.id==="lform"){
    S.loginErr="";
    try{await login($("#lmail").value.trim(),$("#lpw").value);S.login=false;}catch(er){S.loginErr=er.message;}
    render();
  }
});
document.addEventListener("input",e=>{
  if(e.target.id!=="code")return;
  const v=e.target.value.replace(/\D/g,"").slice(0,6);e.target.value=v;
  if(v.length===6)check();
});
document.addEventListener("click",async e=>{
  if(e.target.closest("#ft")){ // versteckter Admin-Zugang: 5× schnell auf die Fußzeile tippen
    const n=Date.now();S.taps=n-S.tapT<1500?S.taps+1:1;S.tapT=n;
    if(S.taps>=5&&!S.admin){S.taps=0;S.login=true;S.loginErr="";render();}
    return;
  }
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="logout")return logout();
  if(a==="lclose"){S.login=false;return render();}
  const box=b.closest(".ctl");if(!box)return;
  const id=box.dataset.id;b.disabled=true;
  try{
    if(a==="inc"||a==="dec")await adjust(id,a==="inc"?1:-1);
    if(a==="save"){
      const g=f=>box.querySelector(`[data-f="${f}"]`).value;
      const qty=Math.max(0,parseInt(g("qty"),10)||0),price=Math.max(0,Math.round((parseFloat(g("price"))||0)*100)/100);
      await saveItem(id,{qty,price,mode:g("mode")==="approx"?"approx":"exact"});
    }
    S.force=true;await loadStock();
  }catch(er){alert(er.message);b.disabled=false;}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadStock();});

/* ---------- Schnee ---------- */
(function(){
  const c=$("#snow"),x=c.getContext("2d");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  let w,h,f=[];
  const size=()=>{w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";};
  size();addEventListener("resize",size);
  for(let i=0;i<55;i++)f.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,s:.0006+Math.random()*.0012,d:Math.random()*6});
  (function loop(t){
    if(!document.hidden){x.clearRect(0,0,w,h);x.fillStyle="rgba(255,255,255,.8)";
      for(const p of f){p.y+=p.s;if(p.y>1.02){p.y=-.02;p.x=Math.random();}
        x.beginPath();x.arc((p.x+Math.sin(t/2200+p.d)*.015)*w,p.y*h,p.r*devicePixelRatio,0,7);x.fill();}}
    requestAnimationFrame(loop);
  })(0);
})();

/* ---------- Start ---------- */
(function(){
  if(!DEMO){try{const t=JSON.parse(localStorage.getItem("jcbs-tok")||"null");if(t){S.tok=t;
    api("/rest/v1/rpc/is_admin",{method:"POST",body:{},auth:true}).then(v=>{S.admin=v===true;if(!S.admin)logout();else render();}).catch(()=>logout());}}catch(e){}}
  if(location.hash==="#admin"){S.login=true;history.replaceState(null,"",location.pathname);}
  render();loadStock();setInterval(()=>{if(!document.hidden)loadStock();},CFG.poll);
})();
</script>
