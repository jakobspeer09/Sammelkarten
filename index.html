:root{--bg:#0b1020;--bg2:#141c38;--card:#18213f;--line:#2a3560;--txt:#f4f6fb;--mut:#9aa6c4;--red:#e63946;--red2:#ff5d6c;--gold:#f5c451;--ice:#9fd8ff;--green:#3ddc97;--amber:#ffb84d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;
 background-image:radial-gradient(circle at 20% -10%,#24305e 0,transparent 55%),radial-gradient(circle at 110% 30%,#3a1530 0,transparent 45%);background-attachment:fixed}
#snow,#fx{position:fixed;inset:0;pointer-events:none}
#snow{z-index:0}#fx{z-index:30}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
h1,h2,.disp{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font-size:1.9rem;line-height:1.05;text-shadow:3px 3px 0 var(--red);position:relative;display:inline-block}
h2::after{content:"";position:absolute;left:0;bottom:-6px;height:4px;width:0;background:linear-gradient(90deg,var(--gold),transparent);border-radius:4px;transition:width .8s .2s cubic-bezier(.2,.8,.2,1)}
.in h2::after,h2.in::after{width:70%}
.kicker{font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:block}
section{margin-top:40px;scroll-margin-top:72px}
.sub{color:var(--mut);margin:10px 0 16px;font-size:.95rem}
/* Einblenden beim Scrollen */
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
/* Kopf */
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,16,32,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.adm+.top{top:44px}
.nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;color:var(--txt);text-decoration:none;font-size:.82rem;font-weight:600;padding:7px 13px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);transition:background .25s,border-color .25s,color .25s}
.nav a.on{background:var(--red);border-color:var(--red2);color:#fff}
.nav a:active{transform:scale(.96)}
.hero{position:relative;padding:40px 0 10px;text-align:center}
.burst{position:absolute;left:50%;top:10px;width:340px;height:340px;transform:translateX(-50%);z-index:-1;opacity:.55;
 background:repeating-conic-gradient(from 0deg,rgba(245,196,81,.22) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 60s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.mini{position:absolute;width:54px;aspect-ratio:63/88;border-radius:8px;background:var(--mc);box-shadow:0 0 22px var(--mc);z-index:-1;opacity:.9;animation:bob 5s ease-in-out infinite}
.mini::after{content:"";position:absolute;inset:4px;border-radius:5px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 50%,rgba(0,0,0,.2))}
.mini.m1{left:2%;top:60px;--rot:-16deg}.mini.m2{right:3%;top:40px;--rot:14deg;animation-delay:-1.6s}.mini.m3{right:12%;top:200px;width:40px;--rot:22deg;animation-delay:-3s}
.mini.rb{background:conic-gradient(#ff4d6d,#ffb84d,#f5e663,#3ddc97,#4dc3ff,#9b6bff,#ff4d6d);--mc:#ff4d6d}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-14px) rotate(calc(var(--rot) * -.4))}}
.hero h1{font-size:3.8rem;line-height:.92;text-shadow:4px 4px 0 var(--red),8px 8px 0 rgba(0,0,0,.35)}
.hero h1 .l2{display:block;font-size:2.2rem;background:linear-gradient(100deg,#f5c451 30%,#fff6d6 45%,#f5c451 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(3px 3px 0 var(--red));animation:gold 3.5s linear infinite}
@keyframes gold{from{background-position:100% 0}to{background-position:-150% 0}}
.ch{display:inline-block;animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{opacity:0;transform:translateY(-40px) scale(2.2) rotate(-8deg)}to{opacity:1;transform:none}}
.hero p{color:var(--mut);margin:14px auto 0;max-width:340px;animation:fade 1s .8s both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;padding:6px 12px;border-radius:99px;background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.5);color:#ffd6da;font-size:.8rem;font-weight:600;animation:fade .7s both}
/* Code-Suche */
.scan{position:relative;padding:20px;border-radius:24px;background:linear-gradient(160deg,#1d2752,#141c38);border:1px solid var(--line);overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.scan::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:9px 9px;pointer-events:none}
.scan::after{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 100% 0%,rgba(255,255,255,.035) 0 2deg,transparent 2deg 9deg);pointer-events:none}
.scan>*{position:relative;z-index:1}
.code{display:flex;gap:10px;margin-top:14px}
.code input{flex:1;min-width:0;height:58px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:#0c1228;color:#fff;font:400 1.9rem Anton,Impact,sans-serif;letter-spacing:.35em;text-align:center;transition:border-color .2s,box-shadow .2s}
.code input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,196,81,.18),0 0 26px rgba(245,196,81,.25)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:800 .95rem Inter,sans-serif;color:#fff;padding:0 18px;height:58px;border-radius:14px;background:linear-gradient(135deg,var(--red2),var(--red));box-shadow:0 6px 0 #9d1f2a;transition:transform .08s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #9d1f2a}
.btn.sm{height:38px;padding:0 12px;font-size:.85rem;border-radius:10px;box-shadow:0 3px 0 #9d1f2a}
.btn.ghost{background:var(--bg2);border:1px solid var(--line);box-shadow:none}
.btn.ghost::after,.btn.sm::after{display:none}
.btn:disabled{opacity:.5}
.msg{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.4);font-size:.9rem;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* Pack öffnen */
.result{margin-top:18px;display:grid;gap:16px}
.stage{position:relative;display:grid;place-items:center;padding:10px 0 4px}
.rays{position:absolute;width:420px;height:420px;left:50%;top:50%;margin:-210px 0 0 -210px;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 45%,transparent) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 65%);mask:radial-gradient(circle,#000 10%,transparent 65%);animation:spin2 14s linear infinite,fade .8s both;pointer-events:none}
@keyframes spin2{to{transform:rotate(360deg)}}
.pack{width:150px;height:210px;border-radius:14px;position:relative;background:linear-gradient(160deg,#2b3b7a,#141c38);border:2px solid var(--gold);box-shadow:0 0 30px rgba(245,196,81,.35);display:grid;place-items:center;animation:wobble .9s ease-in-out both}
.pack::before{content:"";position:absolute;inset:0;border-radius:12px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 6px,transparent 6px 14px)}
.pack b{font:400 2.6rem Anton,sans-serif;color:var(--gold);text-shadow:3px 3px 0 var(--red)}
.pack i{position:absolute;bottom:14px;font:800 .65rem Inter,sans-serif;letter-spacing:.2em;color:var(--ice);font-style:normal}
@keyframes wobble{0%{transform:scale(.6);opacity:0}20%{transform:scale(1);opacity:1}30%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}50%{transform:rotate(-8deg) scale(1.03)}60%{transform:rotate(8deg) scale(1.06)}70%{transform:rotate(-10deg) scale(1.1)}80%{transform:rotate(10deg) scale(1.14)}100%{transform:scale(1.25);filter:brightness(2.5)}}
.flash{position:fixed;inset:0;z-index:25;background:radial-gradient(circle,#fff,color-mix(in srgb,var(--rc) 60%,#fff) 40%,transparent 75%);pointer-events:none;animation:flash .6s ease-out both}
@keyframes flash{from{opacity:1}to{opacity:0}}
/* Sammelkarte */
.tcard{--rc:#9aa4b5;--mx:50%;--my:50%;width:min(260px,78vw);aspect-ratio:63/88;margin:0 auto;padding:9px;border-radius:16px;background:var(--rc);box-shadow:0 0 0 2px rgba(255,255,255,.15),0 0 40px color-mix(in srgb,var(--rc) 60%,transparent);position:relative;transform-style:preserve-3d;transition:transform .15s ease-out;touch-action:none;animation:reveal .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes reveal{from{transform:perspective(800px) rotateY(180deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.tcard .glare{position:absolute;inset:0;border-radius:16px;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 45%);mix-blend-mode:soft-light;opacity:0;transition:opacity .2s}
.tcard.tilt .glare{opacity:1}
.tc-in{height:100%;border-radius:10px;background:linear-gradient(#f8f1de,#ecdcb6);color:#2a2116;display:flex;flex-direction:column;padding:8px;gap:6px;overflow:hidden}
.tc-name{font:400 1.15rem Anton,sans-serif;text-align:center;background:linear-gradient(#fff6dc,#e9d29a);border:1px solid #bfa060;border-radius:6px;padding:2px 4px}
.tc-img{flex:1;border-radius:8px;overflow:hidden;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 70%,#fff),color-mix(in srgb,var(--rc) 60%,#000));display:grid;place-items:center}
.tc-img img{width:100%;height:100%;object-fit:cover}
.tc-img svg{width:70%;opacity:.85}
.tc-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tc-box{background:#fff8e6;border:1px solid #c9ad72;border-radius:6px;padding:3px 6px;text-align:center;line-height:1.15}
.tc-box small{display:block;font-size:.55rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7a6440}
.tc-box b{font-size:.78rem}
.tc-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.62rem;font-weight:800;text-transform:uppercase;background:#2b2f45;color:#fff;border-radius:6px;padding:4px 7px}
.tc-foot .rs{color:var(--rc);white-space:nowrap}
.foil::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.75) 40%,transparent 55%);background-size:250% 100%;animation:shine 2.6s ease-in-out infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.rainbow{background:conic-gradient(from var(--a),#ff4d6d,#ffb84d,#f5e663,#3ddc97,#4dc3ff,#9b6bff,#ff4d6d)!important}
.tcard.rainbow{animation:reveal .8s cubic-bezier(.2,.9,.3,1.2) both,rot 4s linear infinite}
.dot.rainbow,.mini.rainbow{animation:rot 4s linear infinite}
@keyframes rot{to{--a:360deg}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;animation:pop .5s both}
.fact:nth-child(2){animation-delay:.08s}.fact:nth-child(3){animation-delay:.16s}.fact:nth-child(4){animation-delay:.24s}.fact:nth-child(5){animation-delay:.32s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}}
.fact small{display:block;color:var(--mut);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.fact b{font-size:1.1rem}
.fact.wide{grid-column:1/-1}
/* Stand / Bestand */
.live{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--green)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.items{display:grid;gap:12px}
.item{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;transition:transform .2s}
.item:active{transform:scale(.985)}
.item.epic{border-color:#7b52ff;background:linear-gradient(135deg,#251c52,var(--card) 60%)}
.item.epic::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(155,107,255,.18) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.5s linear infinite;pointer-events:none}
.ico{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;background:var(--bg2);overflow:hidden}
.ico svg{width:40px;height:40px}
.ico img{width:100%;height:100%;object-fit:cover}
.item h3{margin:0;font-size:1rem;line-height:1.25}
.item p{margin:2px 0 0;font-size:.8rem;color:var(--mut)}
.price{font:400 1.35rem Anton,sans-serif;color:var(--gold);text-align:right;white-space:nowrap}
.pill{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:800}
.ok{background:rgba(61,220,151,.15);color:var(--green)}
.low{background:rgba(255,184,77,.16);color:var(--amber);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 0 3px rgba(255,184,77,.18)}}
.out{background:rgba(230,57,70,.18);color:#ff8a94}
.bump{animation:bump .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.25);box-shadow:0 0 0 6px rgba(245,196,81,.35)}100%{transform:scale(1)}}
.item.sold>*:not(.stamp),.fitem.sold .pic,.fitem.sold .bd{opacity:.4}
.stamp{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-12deg);font:400 1.05rem Anton,sans-serif;letter-spacing:.06em;color:var(--red2);border:3px solid var(--red2);border-radius:8px;padding:2px 8px;background:rgba(11,16,32,.6);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:translateY(-50%) rotate(-12deg) scale(2.5);opacity:0}}
.fitem .stamp{top:38%;right:50%;transform:translate(50%,-50%) rotate(-12deg);animation:none}
.food{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fitem{position:relative;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden}
.fitem .pic{aspect-ratio:1;background:linear-gradient(135deg,#3b2414,#1f1510);display:grid;place-items:center;overflow:hidden}
.fitem .pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.fitem:active .pic img{transform:scale(1.06)}
.fitem .pic svg{width:56%;animation:bob2 4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-6px) rotate(8deg)}}
.fitem .bd{padding:10px 12px 12px}
.fitem h3{margin:0;font-size:.92rem;line-height:1.25}
.fitem .price{text-align:left;font-size:1.15rem}
.upd{font-size:.75rem;color:var(--mut);margin-top:10px;text-align:right}
.ftitle{margin:26px 0 12px}
/* Seltenheiten */
.rar{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.rrow.glanz::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);background-size:250% 100%;animation:shine 3s linear infinite;pointer-events:none}
.dot{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);background:var(--rc);box-shadow:0 0 12px var(--rc)}
.rrow b{font-size:.95rem}
.rrow span{font-size:.82rem;color:var(--mut);text-align:right;min-width:52px}
.rhead{display:grid;grid-template-columns:14px 1fr auto auto;gap:12px;padding:0 14px 6px;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.rhead span{min-width:52px;text-align:right}
.rhead span:first-of-type{text-align:left}
/* Kategorien */
.kats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kat{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .2s}
.kat:active{transform:scale(.97)}
.kat::after{content:"";position:absolute;right:-18px;bottom:-18px;width:60px;height:60px;border-radius:50%;background:var(--kc);opacity:.25;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.35);opacity:.4}}
.kat b{display:block;font-size:.92rem}
.kat small{color:var(--mut);font-size:.75rem}
.bonus{margin-top:12px;padding:14px;border-radius:14px;border:1px dashed var(--gold);background:rgba(245,196,81,.07);font-size:.9rem}
/* Infos */
.info{display:grid;gap:10px;margin-top:14px}
.irow{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.irow svg{flex:none;width:26px;height:26px;color:var(--gold)}
.irow small{display:block;color:var(--mut);font-size:.75rem}
footer{margin-top:44px;text-align:center;color:var(--mut);font-size:.8rem}
footer .ft{user-select:none;-webkit-user-select:none;cursor:default;padding:10px}
.legal{display:flex;justify-content:center;gap:18px}
.legal button{background:none;border:0;color:var(--mut);font:600 .8rem Inter,sans-serif;text-decoration:underline;cursor:pointer;padding:6px}
/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,8,18,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s both}
.mbox{width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px;animation:pop .3s both}
.mbox input,.mbox textarea{width:100%;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:#0c1228;color:#fff;padding:10px 12px;font:16px Inter,sans-serif}
.mbox input{height:46px}
.mbox textarea{min-height:120px;resize:vertical;line-height:1.45}
.mbox .row{display:flex;gap:10px;margin-top:16px}
.mbox .row .btn{flex:1;height:46px}
.lt h3{font-size:1rem;margin:18px 0 4px;color:var(--gold)}
.lt p{margin:0 0 8px;color:#d6dcef;font-size:.9rem;white-space:pre-line}
/* Admin */
.adm{position:sticky;top:0;z-index:6;margin:0 -16px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;min-height:44px;background:var(--gold);color:#1a1300;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:800}
.adm span{flex:1}
.adm button{border:0;border-radius:8px;padding:7px 10px;background:#1a1300;color:var(--gold);font:800 .78rem Inter,sans-serif}
.adm button.on{background:var(--red);color:#fff}
.editing [data-t]{outline:2px dashed rgba(245,196,81,.75);outline-offset:2px;border-radius:4px;cursor:text}
.ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding-top:10px;border-top:1px dashed var(--line)}
.ctl input,.ctl select,.ed input,.ed select{height:38px;border-radius:10px;border:1px solid var(--line);background:#0c1228;color:#fff;padding:0 8px;font:600 .9rem Inter,sans-serif;min-width:0}
.ctl input[type=number]{width:74px}
.ctl label,.ed label{font-size:.7rem;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.ctl .w{flex:1 1 140px}
.ctl .w input{width:100%}
.fitem .ctl{padding:10px 12px 12px}
.ed{margin-top:14px;padding:14px;border-radius:16px;border:2px dashed var(--gold);background:rgba(245,196,81,.05);display:grid;gap:10px}
.ed .er{display:grid;gap:6px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.ed .er .ln{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.ed .er .ln>label{flex:1 1 90px}
.ed .er input{width:100%}
.ed input[type=color]{padding:2px;width:46px;flex:none}
.ed .id{font-size:.68rem;color:var(--mut)}
.ed h4{margin:0;font-size:.85rem;color:var(--gold)}
.x{border:0;background:rgba(230,57,70,.18);color:#ff8a94;border-radius:10px;height:38px;min-width:38px;font-weight:800;cursor:pointer}
.mv{border:0;background:var(--bg2);color:var(--txt);border-radius:10px;height:38px;min-width:38px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:#1a1300;color:var(--gold);border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-weight:800;font-size:.85rem;animation:pop .3s both}
/* ===== App-Aufbau (Tabs unten) ===== */
main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:400 1.3rem Anton,Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;text-shadow:2px 2px 0 var(--red);color:var(--txt);text-decoration:none}
.brand b{font-weight:400;color:var(--gold)}
.accb{display:inline-flex;align-items:center;gap:6px;max-width:58%;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font:700 .82rem Inter,sans-serif;cursor:pointer}
.accb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accb svg{width:18px;height:18px;flex:none;color:var(--gold)}
.accb.in{border-color:var(--gold)}
.page{animation:pagein .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes pagein{from{opacity:0;transform:translateY(12px)}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(11,16,32,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs .tw{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);text-decoration:none;font-size:.7rem;font-weight:700;position:relative;transition:color .2s}
.tabs a svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.tabs a.on{color:var(--gold)}
.tabs a.on svg{transform:translateY(-2px) scale(1.12)}
.tabs a.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.tabs .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:.62rem;line-height:16px;text-align:center}
.toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);color:var(--txt);text-decoration:none;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile svg{width:34px;height:34px}
.tile b{display:block;font-size:.95rem}
.tile small{color:var(--mut);font-size:.78rem}
/* Album */
.bar{height:8px;border-radius:99px;background:#0c1228;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,var(--kc,var(--gold)),color-mix(in srgb,var(--kc,var(--gold)) 55%,#fff));border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.me{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:linear-gradient(160deg,#1d2752,#141c38);border:1px solid var(--line)}
.ring{flex:none;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#0c1228 0);display:grid;place-items:center}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:400 1rem Anton,sans-serif}
.me .t{flex:1;min-width:0}
.me .t b{display:block;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .t small{color:var(--mut);font-size:.8rem}
.acat{margin-top:18px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.acat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc)}
.ahead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.ahead b{font:400 1.25rem Anton,sans-serif;letter-spacing:.03em;text-transform:uppercase}
.ahead span{font-size:.8rem;color:var(--mut);font-weight:700;white-space:nowrap}
.slots>*{min-width:0}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.slot{all:unset;box-sizing:border-box;display:block;aspect-ratio:63/88;border-radius:10px;padding:4px;background:var(--rc);position:relative;cursor:pointer;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 45%,transparent);transition:transform .15s}
.slot:active{transform:scale(.95)}
.slot.foil{overflow:hidden}
.sl-in{height:100%;border-radius:7px;background:linear-gradient(#f8f1de,#ecdcb6);display:flex;flex-direction:column;gap:3px;padding:4px;overflow:hidden;color:#2a2116}
.sl-name{font:400 .72rem/1.15 Anton,sans-serif;text-align:center;background:linear-gradient(#fff6dc,#e9d29a);border:1px solid #bfa060;border-radius:4px;padding:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-img{flex:1;border-radius:5px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 70%,#fff),color-mix(in srgb,var(--rc) 60%,#000))}
.sl-img img{width:100%;height:100%;object-fit:cover}
.sl-img svg{width:70%}
.sl-st{font-size:.58rem;text-align:center;color:var(--rc);background:#2b2f45;border-radius:4px;font-weight:800;white-space:nowrap;overflow:hidden}
.slot.miss{cursor:default;background:#2a3354;box-shadow:none}
.slot.miss:active{transform:none}
.slot.miss .sl-in{background:#1a2140}
.slot.miss .sl-name{background:#2a3354;border-color:#3a4570;color:#c8d0ea}
.px{background:repeating-conic-gradient(#343e66 0 25%,#283050 0 50%) 0 0/12px 12px!important;color:#7581a6}
.px svg{width:36%!important;opacity:.9}
.slot.new{animation:slotnew 1.2s cubic-bezier(.2,1.6,.4,1)}
@keyframes slotnew{0%{transform:scale(.4) rotate(-10deg);filter:brightness(3)}60%{transform:scale(1.08)}100%{transform:none}}
.acat.done{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 30px rgba(245,196,81,.25)}
.done-b{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(245,196,81,.2),rgba(230,57,70,.15));border:1px solid var(--gold);font-size:.86rem}
.done-b b{display:block;font:400 1.4rem Anton,sans-serif;letter-spacing:.05em;color:var(--gold);text-shadow:2px 2px 0 var(--red)}
.note{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;animation:pop .4s both}
.note.ok{border-color:var(--green);background:rgba(61,220,151,.1)}
.note.gold{border-color:var(--gold);background:rgba(245,196,81,.12)}
.tabsw{display:flex;gap:6px;background:#0c1228;border-radius:12px;padding:4px;margin-top:12px}
.tabsw button{flex:1;height:38px;border:0;border-radius:9px;background:none;color:var(--mut);font:700 .85rem Inter,sans-serif;cursor:pointer}
.tabsw button.on{background:var(--red);color:#fff}
.hint{font-size:.78rem;color:var(--mut);margin:10px 0 0}
.skel{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--card),#202a4d,var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite;margin-top:18px}
@keyframes sk{to{background-position:-200% 0}}
.ed .ed-in{display:flex;flex-direction:column;gap:2px;font-size:.7rem;color:var(--mut)}

/* ================= DESIGN: Weihnachts-Karten-Look (passend zu den Sammelkarten) ================= */
:root{--bg:#0f3a29;--bg2:#154a34;--card:#fbf4e2;--line:#c9a24a;--txt:#f7efdc;--mut:#b9cfc1;--red:#c8202f;--red2:#e0414c;--gold:#e2b440;--ice:#9fd8ff;--green:#1e8a45;--amber:#b56d12;--ink:#2a1a0a;--ink2:#6b5a3e;--r:14px;
 --panel:linear-gradient(170deg,#fffdf7 0%,#fbf4e2 55%,#f2e6c8 100%);
 --pshadow:inset 0 0 0 1.5px #b8902f,inset 0 0 0 3px #fff6dc,inset 0 0 0 4px #c9a24a,0 10px 24px -12px rgba(0,0,0,.7);
 --ribbon:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20500%20102%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22r%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23fffaea%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23f6e8c2%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23e2c98c%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22t%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ead39a%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23c6a55c%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%238a6418%22%2F%3E%3Cstop%20offset%3D%22.3%22%20stop-color%3D%22%23f3d77a%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23b38422%22%2F%3E%3Cstop%20offset%3D%22.78%22%20stop-color%3D%22%23ffe9a6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238a6418%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M0%2034%20H70%20V96%20H0%20L20%2065Z%22%20fill%3D%22url%28%23t%29%22%20stroke%3D%22%23a07c30%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M500%2034%20H430%20V96%20H500%20L480%2065Z%22%20fill%3D%22url%28%23t%29%22%20stroke%3D%22%23a07c30%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M48%2096%20L70%20106%20V96Z%22%20fill%3D%22%237d5c1c%22%2F%3E%3Cpath%20d%3D%22M452%2096%20L430%20106%20V96Z%22%20fill%3D%22%237d5c1c%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%224%22%20width%3D%22404%22%20height%3D%2292%22%20rx%3D%2212%22%20fill%3D%22url%28%23r%29%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%228%22%2F%3E%3Crect%20x%3D%2260%22%20y%3D%2214%22%20width%3D%22380%22%20height%3D%2272%22%20rx%3D%227%22%20fill%3D%22none%22%20stroke%3D%22%23c9a24a%22%20stroke-width%3D%222%22%20opacity%3D%22.7%22%2F%3E%3C%2Fsvg%3E")}
body{background-color:#0c2e20;color:var(--txt);background-image:repeating-linear-gradient(45deg,rgba(200,30,45,.07) 0 16px,rgba(0,0,0,0) 16px 32px,rgba(255,255,255,.025) 32px 48px,rgba(0,0,0,0) 48px 64px),radial-gradient(ellipse 120% 80% at 50% 0%,#1d6142 0%,#0f3a29 55%,#0a2619 100%);background-attachment:fixed}
#snow{display:block;opacity:.85}
h1,h2,.disp{font-family:Lilita,Inter,sans-serif;font-weight:400;text-transform:none;letter-spacing:.01em}
h2{display:inline-block;font-size:1.45rem;line-height:1.1;color:#16683a;text-shadow:none;padding:.42em 1.75em .5em;background:var(--ribbon) center/100% 100% no-repeat;margin-left:-6px}
h2::after{display:none}
.kicker{font-family:RC,Inter,sans-serif;font-weight:700;color:var(--gold);letter-spacing:.2em;font-size:.72rem;margin-bottom:4px}
.sub{color:var(--mut);font-family:Bree,Georgia,serif;font-size:.95rem}
section{margin-top:34px}
/* Kopf, Tabs */
.top{background:rgba(10,38,25,.94);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#8a6418,#f3d77a,#b38422,#ffe9a6,#8a6418) 1}
.brand{display:inline-flex;align-items:center;gap:8px;font:400 1.15rem Lilita,Inter,sans-serif;letter-spacing:.02em;text-shadow:none;color:#f7efdc}
.brand img{height:30px;width:auto}
.brand b{font-weight:400;color:var(--gold)}
.accb{background:var(--panel);border:0;box-shadow:inset 0 0 0 1.5px #c9a24a;color:var(--ink);font-family:RC,Inter,sans-serif;font-weight:700}
.accb svg{color:var(--red)}
.accb.in{box-shadow:inset 0 0 0 2px #e2b440,0 0 0 2px rgba(226,180,64,.25)}
.tabs{background:rgba(10,38,25,.97);border-top:2px solid transparent;border-image:linear-gradient(90deg,#8a6418,#f3d77a,#b38422,#ffe9a6,#8a6418) 1;box-shadow:0 -8px 22px -12px rgba(0,0,0,.6)}
.tabs a{color:var(--mut);font-family:RC,Inter,sans-serif;font-size:.72rem;letter-spacing:.04em}
.tabs a.on{color:#f3d77a}
.tabs a.on::before{background:linear-gradient(90deg,#b38422,#f3d77a,#b38422);box-shadow:0 0 10px rgba(243,215,122,.6);top:-8px}
.tabs .bd{background:var(--red);box-shadow:0 0 0 1.5px var(--gold)}
/* Start */
.hero{padding:16px 0 0}
.hlogo{display:block;width:min(200px,52vw);height:auto;margin:0 auto -6px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));animation:fade .9s both}
.hero h1{font-size:1rem;line-height:1;text-shadow:none;color:var(--txt);margin-top:6px}
.hero h1 .l1{display:block;font-family:RC,Inter,sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.42em;color:var(--gold);margin-bottom:6px}
.hero h1 .l2{display:inline-block;font-size:2.2rem;color:#16683a;padding:.34em 1.6em .44em;background:var(--ribbon) center/100% 100% no-repeat;-webkit-background-clip:border-box;background-clip:border-box;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));animation:none}
.hero p{color:var(--mut);font-family:Bree,Georgia,serif}
.badge{background:none;border:0;box-shadow:none;color:#f3d77a;font:400 1.55rem Xmas,Georgia,serif;margin:4px 0 0;padding:0}
.badge::before{content:none}
/* Creme-Kartenflächen */
.scan,.fact,.note,.tile,.item,.fitem,.rrow,.kat,.irow,.bonus,.me,.acat,.mbox,.cpanel{background:var(--panel);border:0;box-shadow:var(--pshadow);color:var(--ink)}
.scan{border-radius:18px;padding:18px}
.scan h2,.acat h2{margin-top:2px}
.scan .sub,.tile small,.item p,.fitem p,.fact small,.irow small,.rrow span,.me .t small,.hint,.mbox .sub,.ahead span{color:var(--ink2)}
.scan .sub{font-size:.92rem}
.scan .kicker{color:#b3141f}
.code input{background:#fffaf0;border:2px solid #c9a24a;color:var(--ink);font:400 1.9rem Lilita,Anton,sans-serif;letter-spacing:.32em;box-shadow:inset 0 2px 6px rgba(120,80,20,.15)}
.code input::placeholder{color:#d8c79e}
.code input:focus{border-color:#16683a;box-shadow:0 0 0 4px rgba(30,138,69,.18)}
.btn{background:linear-gradient(180deg,#d8303d,#9a1420);color:#fff;font:700 .95rem RC,Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 0 2px #e2b440,0 4px 0 #5e0a12}
.btn::after{display:none}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 2px #e2b440,0 2px 0 #5e0a12}
.btn.sm{box-shadow:0 0 0 1.5px #e2b440,0 2px 0 #5e0a12;font-size:.8rem}
.btn.ghost{background:#fffaf0;color:var(--ink);box-shadow:0 0 0 1.5px #c9a24a}
.msg{background:#fdecec;border:1px solid #e9a4a9;color:#8f1f27}
.pack{background:linear-gradient(160deg,#2f9e55,#16683a 50%,#0a3f22);border:2px solid #e2b440;box-shadow:0 0 0 3px rgba(226,180,64,.25),0 14px 28px -12px rgba(0,0,0,.7)}
.pack::before{background:repeating-linear-gradient(45deg,rgba(200,30,45,.55) 0 5px,transparent 5px 10px,rgba(255,255,255,.14) 10px 15px,transparent 15px 20px)}
.pack b{font-family:Lilita,sans-serif;color:#f3d77a;text-shadow:0 2px 0 #5e0a12}
.pack i{color:#fff6dc;font-family:RC,Inter,sans-serif}
.flash{background:radial-gradient(circle,rgba(255,246,200,.9),transparent 70%)}
.fact b{color:var(--ink)}
.note.ok{background:linear-gradient(170deg,#f2fbf3,#dff1e3);box-shadow:inset 0 0 0 1.5px #1e8a45,inset 0 0 0 3px #fff,inset 0 0 0 4px #7cc08f}
.note.gold{background:linear-gradient(170deg,#fffaf0,#fbe8b8);box-shadow:var(--pshadow)}
.tile b{font-family:Lilita,Inter,sans-serif;font-weight:400;font-size:1.05rem;color:#16683a}
/* Stand */
.live{color:#8fe0a4}
.live i{background:#3ddc84}
.item h3,.fitem h3{font-family:Lilita,Inter,sans-serif;font-weight:400;font-size:1.08rem;color:var(--ink)}
.item.epic{background:linear-gradient(135deg,#f3ecff,#fbf4e2 60%);box-shadow:inset 0 0 0 1.5px #7a52c7,inset 0 0 0 3px #fff,inset 0 0 0 4px #b79bff,0 10px 24px -12px rgba(0,0,0,.7)}
.item.epic::before{display:none}
.ico{background:#f1e4c2;box-shadow:inset 0 0 0 1px #d9c08a}
.price{font:400 1.3rem Lilita,Inter,sans-serif;color:#b3141f}
.fitem .price{font-size:1.15rem}
.ok{background:#e1f3e6;color:#1a7a3e}
.low{background:#fdf0dc;color:#a35f0c;animation:none}
.out{background:#fbe3e4;color:#b3141f}
.stamp{color:#b3141f;border-color:#b3141f;background:rgba(255,250,240,.9);font-family:Lilita,sans-serif}
.fitem .pic{background:linear-gradient(135deg,#f6e2bf,#e5c591)}
.upd{color:var(--mut)}
.ftitle{color:var(--gold)}
/* Infos */
.rrow b,.irow b{color:var(--ink)}
.rhead{color:var(--mut);font-family:RC,Inter,sans-serif}
.rrow.glanz::after{background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 60%);background-size:250% 100%}
.irow svg{color:#b3141f}
.bonus{font-family:Bree,Georgia,serif;font-size:.92rem}
footer{color:var(--mut)}
.legal button{color:var(--mut)}
/* Album */
.me .t b{font-family:Lilita,Inter,sans-serif;font-weight:400;font-size:1.15rem;color:#16683a}
.ring{background:conic-gradient(#c8202f calc(var(--p)*1%),#e8dcbd 0);box-shadow:0 0 0 2px #e2b440}
.ring b{background:#fffaf0;font-family:Lilita,sans-serif;font-weight:400;color:var(--ink)}
.acat{border-radius:16px}
.acat::before{width:5px}
.ahead b{font-family:Lilita,Inter,sans-serif;font-weight:400;text-transform:none;letter-spacing:.01em;font-size:1.2rem;color:var(--ink)}
.bar{background:#e8dcbd;border:1px solid #d3bd8b}
.bar i{background:linear-gradient(90deg,var(--kc,#c8202f),color-mix(in srgb,var(--kc,#c8202f) 55%,#fff))}
.slot{box-shadow:0 5px 12px -6px rgba(0,0,0,.6)}
.slot.miss{background:transparent;border:2px dashed #cdb98a;padding:2px;box-shadow:none}
.slot.miss .sl-in{background:#f3e8cc}
.slot.miss .sl-name{background:#e9dbb6;border-color:#d6c293;color:#7a6648;font-family:RC,Inter,sans-serif;font-weight:700;font-size:.6rem}
.px{background:repeating-conic-gradient(#e6d6ae 0 25%,#efe3c6 0 50%) 0 0/10px 10px!important;color:#b29d6c}
.acat.done{box-shadow:inset 0 0 0 1.5px #b8902f,inset 0 0 0 3px #fff6dc,inset 0 0 0 4px #c9a24a,0 0 0 3px #e2b440,0 0 26px rgba(226,180,64,.45)}
.done-b{background:linear-gradient(170deg,#fffaf0,#fbe8b8);border:1.5px solid #c9a24a;color:var(--ink);font-family:Bree,Georgia,serif}
.done-b b{font:400 1.5rem Xmas,Georgia,serif;letter-spacing:0;color:#b3141f;text-shadow:none}
.done-b b::before{content:"★ "}
.skel{background:linear-gradient(90deg,rgba(251,244,226,.15),rgba(251,244,226,.3),rgba(251,244,226,.15));background-size:200% 100%}
/* Modal, Formulare, Admin */
.modal{background:rgba(4,20,12,.65)}
.mbox h2{font-size:1.25rem!important}
.mbox input,.mbox textarea{background:#fffdf7;color:var(--ink);border:1.5px solid #c9a24a}
.mbox input:focus,.mbox textarea:focus{outline:2px solid #16683a;outline-offset:-1px}
.tabsw{background:#ecdfbd}
.tabsw button{color:var(--ink2);font-family:RC,Inter,sans-serif}
.tabsw button.on{background:linear-gradient(180deg,#d8303d,#9a1420);color:#fff;box-shadow:0 0 0 1.5px #e2b440}
.lt h3{color:#b3141f;font-family:Lilita,Inter,sans-serif;font-weight:400}
.lt p{color:#3a2a14}
.toast{background:#0f3a29;color:#f3d77a;border:1.5px solid #e2b440}
.ctl input,.ctl select,.ed input,.ed select{background:#fffdf7;color:var(--ink);border:1px solid #c9a24a}
.ctl label,.ed label,.ed .ed-in,.ed .id{color:var(--ink2)}
.ctl{border-top-color:#d6c293}
.ed{background:linear-gradient(170deg,#fffdf7,#f6ead0);border:2px dashed #c9a24a;color:var(--ink)}
.ed .er{background:#fffaf0;border-color:#e2d3ac}
.ed h4{color:#b3141f}
.mv{background:#ecdfbd;color:var(--ink)}
.x{background:#fbe3e4;color:#b3141f}
.adm{background:linear-gradient(90deg,#b38422,#f3d77a,#b38422);color:#2a1a0a}

Bestand, Preise, Seitentexte und Kartendaten liegen bei Supabase (Supabase Inc., USA) auf einem Server in Frankfurt am Main. Wenn die Seite den Bestand lädt oder du einen Kartencode prüfst, wird eine Anfrage an diesen Server geschickt. Dabei werden technisch notwendige Daten wie deine IP-Adresse verarbeitet und für kurze Zeit in Protokollen gespeichert. Ohne Anmeldung wird der eingegebene Kartencode nicht dir zugeordnet und nicht dauerhaft gespeichert. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO.

## 5. Sammelalbum-Konto (freiwillig)
Wenn du ein Konto anlegst, speichern wir bei Supabase (Frankfurt): deinen Nickname, dein Passwort nur in verschlüsselter Form (als sogenannter Hash, wir können es nicht lesen), einen zufälligen Anmelde-Schlüssel, welche Karten du in dein Album eingetragen hast und wann. Dein Nickname und dein Album sind für andere Besucher nicht sichtbar. Zweck ist allein, dass dein Album gespeichert bleibt und du es am Stand vorzeigen kannst. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO (Bereitstellung der von dir gewünschten Album-Funktion).
Damit du angemeldet bleibst, wird der Anmelde-Schlüssel im lokalen Speicher deines Browsers abgelegt. Das ist für die Funktion technisch erforderlich (§ 25 Abs. 2 Nr. 2 TDDDG). Beim Abmelden wird er gelöscht.
Bitte wähle keinen Nickname, der deinen echten vollen Namen enthält. Du kannst dein Konto jederzeit selbst löschen (oben rechts auf deinen Nickname tippen → „Konto löschen“); dabei werden alle zugehörigen Daten sofort entfernt. Alle Konten werden nach dem Ende des Projekts gelöscht.

## 6. Admin-Bereich
Der Admin-Bereich ist nur für das Team am Stand gedacht. Bei der Anmeldung werden E-Mail-Adresse und Passwort von Supabase geprüft. Damit die Anmeldung bestehen bleibt, wird auf dem Gerät des Admins ein Anmelde-Token im lokalen Speicher des Browsers abgelegt. Besucher der Website sind davon nicht betroffen.

## 7. Lokaler Speicher im Browser
Damit die Seite schneller lädt, werden die Seitentexte im lokalen Speicher deines Browsers zwischengespeichert. Dabei werden keine personenbezogenen Daten gespeichert. Dieser Speicher ist für den Betrieb der Seite technisch erforderlich (§ 25 Abs. 2 Nr. 2 TDDDG). Du kannst ihn jederzeit über die Einstellungen deines Browsers löschen.

## 8. Daten der Lehrkräfte und Mitarbeitenden
Auf den Sammelkarten und bei der Code-Abfrage erscheinen Name sowie Fächer bzw. Tätigkeitsbereich der teilnehmenden Lehrkräfte und Mitarbeitenden. Dies geschieht nur mit deren Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Die Einwilligung kann jederzeit per E-Mail widerrufen werden; die Daten werden dann entfernt.

## 9. Schriftarten
Die verwendeten Schriftarten sind direkt in die Website eingebettet. Es wird keine Verbindung zu Google oder anderen Schriftanbietern aufgebaut.

## 10. Speicherdauer
Die Daten zu Bestand, Karten und Album-Konten werden nach dem Ende des Projekts gelöscht. Protokolldaten bei GitHub und Supabase werden von den Anbietern nach deren eigenen Fristen gelöscht.

async function api(path,{method="GET",body,auth=false,prefer}={}){
  const h={apikey:CFG.key,"Content-Type":"application/json"};
  if(auth){await ensureTok();h.Authorization="Bearer "+S.tok.access_token;}
  if(prefer)h.Prefer=prefer;
  const r=await fetch(CFG.url+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((d&&(d.message||d.error_description||d.msg))||("Fehler "+r.status));
  return d;
}
function saveTok(d){S.tok={access_token:d.access_token,refresh_token:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000};try{localStorage.setItem("jcbs-tok",JSON.stringify(S.tok))}catch(e){}}
async function ensureTok(){
  if(!S.tok)throw new Error("Nicht angemeldet");
  if(S.tok.exp-60000>Date.now())return;
  const r=await fetch(CFG.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.tok.refresh_token})});
  if(!r.ok){logout();throw new Error("Sitzung abgelaufen, bitte neu anmelden");}
  saveTok(await r.json());
}
async function login(email,pw){
  const r=await fetch(CFG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const m=String(d.error_code||d.msg||d.error_description||d.error||"");
    throw new Error(/confirm/i.test(m)?"E-Mail ist noch nicht bestätigt":/invalid/i.test(m)?"E-Mail oder Passwort falsch":"Anmeldung fehlgeschlagen ("+(m||r.status)+")");}
  saveTok(d);
  S.admin=await api("/rest/v1/rpc/is_admin",{method:"POST",body:{},auth:true})===true;
  if(!S.admin){logout();throw new Error("Dieses Konto ist kein Admin");}
}

async function check(){
  const inp=$("#code"),code=(inp.value||"").replace(/\D/g,"");
  S.card=null;S.err="";S.phase="";S.note="";S.noteK="";S.newName=null;
  if(code.length!==6){S.err=T("err_len");renderResult();return;}
  if(S.busy)return;S.busy=true;inp.blur();
  let c=null,before=doneSet();
  try{
    if(S.pl){c=await rpc("album_add",{p_token:S.pl.token,p_code:code});
      if(c&&c.error==="session"){plSave(null);c=null;}
      else if(c){S.note=c.neu?"new":"have";S.newName=c.neu?c.name:null;}}
    if(!S.pl&&!c){c=await lookup(code);if(c){S.note="guest";S.pending=code;}}
    if(!c)S.err=T("err_none");
  }catch(e){S.err="Prüfen gerade nicht möglich. Bitte gleich nochmal versuchen.";}
  S.busy=false;
  if(c&&S.note==="new"){await loadAlbum();const nd=[...doneSet()].filter(id=>!before.has(id));
    if(nd.length){const g=groups().find(x=>x.k.id===nd[0]);S.noteK=g?g.k.name:"";}}
  if(!c){renderResult();return;}
  S.card=c;$("#result").scrollIntoView({behavior:RM?"auto":"smooth",block:"center"});
  if(RM){renderResult();return;}
  S.phase="pack";renderResult();
  await new Promise(r=>setTimeout(r,950));
  const rc=col(katOf(c.kat).col);
  const f=document.createElement("div");f.className="flash";f.style.setProperty("--rc",rc);document.body.appendChild(f);setTimeout(()=>f.remove(),700);
  S.phase="";renderResult();
  const lvl=isSp(c)?4:1;
  burst(rc,14+lvl*10,isSp(c));
  if(S.noteK)setTimeout(()=>{burst("#c8323c",70,true);toast(T("alb_kdone",{k:S.noteK}));},700);
  if(navigator.vibrate)try{navigator.vibrate(lvl>=3?[40,40,80]:30)}catch(e){}
}

/* ============ EFFEKTE ============ */
let fxP=[],fxOn=false;
function burst(c,n,multi){
  if(RM)return;
  const cv=$("#fx"),x=cv.getContext("2d"),d=devicePixelRatio||1;
  cv.width=innerWidth*d;cv.height=innerHeight*d;
  const card=$(".tcard"),b=card?card.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const cx=(b.left+b.width/2)*d,cy=(b.top+b.height/2)*d,pal=["#ff4d6d","#ffb84d","#f5e663","#3ddc97","#4dc3ff","#9b6bff"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(3+Math.random()*9)*d;
    fxP.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4*d,l:1,r:(2+Math.random()*4)*d,c:multi?pal[i%6]:(Math.random()<.3?"#fff":c),sq:Math.random()<.5,rot:Math.random()*6});}
  if(fxOn)return;fxOn=true;
  (function loop(){
    x.clearRect(0,0,cv.width,cv.height);
    fxP=fxP.filter(p=>p.l>0);
    for(const p of fxP){p.x+=p.vx;p.y+=p.vy;p.vy+=.25*d;p.vx*=.985;p.l-=.012;p.rot+=.2;
      x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.rot);
      if(p.sq)x.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{x.beginPath();x.arc(0,0,p.r,0,7);x.fill();}x.restore();}
    if(fxP.length)requestAnimationFrame(loop);else{fxOn=false;x.clearRect(0,0,cv.width,cv.height);}
  })();
}
function bindTilt(){
  const c=$(".tcard");if(!c||RM)return;
  const mv=e=>{const b=c.getBoundingClientRect(),px=(e.clientX-b.left)/b.width,py=(e.clientY-b.top)/b.height;
    c.classList.add("tilt");c.style.animation="none";
    c.style.transform=`perspective(700px) rotateY(${(px-.5)*24}deg) rotateX(${(.5-py)*24}deg) scale(1.03)`;
    c.style.setProperty("--mx",px*100+"%");c.style.setProperty("--my",py*100+"%");};
  const lv=()=>{c.classList.remove("tilt");c.style.transform="";if(c.classList.contains("rainbow"))c.style.animation="rot 4s linear infinite";};
  c.addEventListener("pointermove",mv);c.addEventListener("pointerleave",lv);c.addEventListener("pointerup",lv);c.addEventListener("pointercancel",lv);
}
let io=null,nio=null;
function observe(){
  if(!("IntersectionObserver"in window)||RM){document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"));return;}
  io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");S.seen.add(e.target.dataset.rv);io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll(".rv").forEach((e,i)=>{if(S.seen.has(e.dataset.rv))e.classList.add("in");else{e.style.transitionDelay=(e.dataset.d||0)+"ms";io.observe(e);}});
}

function slotHTML(c,i){
  if(!c.own)return `<div class="slot miss"><div class="sl-in"><div class="sl-name">${E(c.name)}</div><div class="sl-img px">${IC.lock}</div></div></div>`;
  const k=katOf(c.kat),u=safeImg(c.img),sp=isSp(c);
  return `<button class="slot${sp?" foil":""}${S.newName===c.name?" new":""}" data-a="card" data-i="${i}" style="--rc:${col(k.col)}" aria-label="${E(c.name)}"><div class="sl-in">
   <div class="sl-name">${E(c.name)}</div><div class="sl-img">${u?`<img src="${E(u)}" alt="" loading="lazy">`:IC.hero}</div>
   <div class="sl-st">${sp?"★★★★★":"★"}</div></div></button>`;
}
function pgAlbum(){
  const all=(S.album&&S.album.cards)||[],o=ownCount(),done=doneSet();
  let h=`<section style="margin-top:28px"><div>${tx("k_album",null,"span","kicker")}${tx("h_album",null,"h2")}${tx("s_album",null,"p","sub")}</div>`;
  if(!S.pl)h+=`<div class="scan">${tx("alb_login",null,"p")}<div class="row" style="display:flex;gap:10px;margin-top:14px">
    <button class="btn" style="flex:1" data-a="acc" data-m="login">${E(T("btn_login"))}</button><button class="btn ghost" style="flex:1" data-a="acc" data-m="reg">${E(T("btn_reg"))}</button></div></div>`;
  else{const p=o.m?Math.round(o.n/o.m*100):0;
    h+=`<div class="me"><div class="ring" style="--p:${p}"><b>${p}%</b></div><div class="t"><b>${E(T("hello",{nick:S.pl.nick}))}</b><small>${E(T("alb_count",o))}</small></div>
    <button class="accb" data-a="acc" aria-label="Konto">${IC.user}</button></div>`;}
  if(S.albumErr)h+=`<div class="msg">${E(S.albumErr)}</div>`;
  if(!S.album&&!S.albumErr)h+=`<div class="skel"></div><div class="skel"></div>`;
  if(S.album)h+=`<div class="agrid">`+groups().map(g=>{const n=g.cards.filter(c=>c.own).length,m=g.cards.length,d=done.has(g.k.id)&&S.pl;
    return `<div class="acat${d?" done":""}" style="--kc:${col(g.k.col)}">
     <div class="ahead"><b>${E(g.k.name)}</b><span>${n} / ${m}</span></div>
     <div class="bar"><i style="--p:${m?n/m*100:0}%"></i></div>
     ${m?`<div class="slots">${g.cards.map(c=>slotHTML(c,all.indexOf(c))).join("")}</div>`:`<p class="hint">${E(T("alb_empty"))}</p>`}
     ${d?`<div class="done-b">${tx("alb_done",null,"b")}${g.k.bonus===false?tx("alb_done_sp"):tx("alb_done_txt")}</div>`:""}</div>`;}).join("")+`</div>`;
  if(S.album)h+=rewardsHTML(done);
  if(S.edit)h+=edKat();
  if(S.admin)h+=cardAdminHTML();
  if(S.admin)h+=`<div class="ed" id="edpl"><h4>Spieler-Konten (nur Admin)</h4>
   <label class="ed-in">Nickname<input id="apn" autocapitalize="off" autocomplete="off"></label>
   <label class="ed-in">Neues Passwort (mind. 6 Zeichen)<input id="apnpw" autocomplete="off"></label>
   <div style="display:flex;gap:8px"><button class="btn sm" data-a="apw">Passwort setzen</button><button class="x" style="padding:0 12px" data-a="apdel">Konto löschen</button></div></div>`;
  return h+`</section>`;
}
function pgStand(){
  return `<section id="stand" style="margin-top:28px"><div class="rv" data-rv="hstand">${tx("k_stand",null,"span","kicker")}${tx("h_stand",null,"h2")}
   <p class="sub"><span class="live"><i></i>${tx("live")}</span></p></div><div id="stock" class="rv" data-rv="stock"></div></section>`;
}
function pgInfos(){
  const r=C.rar,hw=[1,2,3,4];
  return `<div class="infopage">
  <section style="margin-top:28px"><div class="rv" data-rv="hhow">${tx("k_how",null,"span","kicker")}${tx("h_how",null,"h2")}</div>
   <div class="steps">${hw.map((n,i)=>`<div class="step cpanel rv" data-rv="hw${n}" data-d="${i*80}"><i>${n}</i><div>${tx("how"+n+"_t",null,"b")}${tx("how"+n,null,"p")}</div></div>`).join("")}</div></section>
  <section id="selten"><div class="rv" data-rv="hselten">${tx("k_selten",null,"span","kicker")}${tx("h_selten",null,"h2")}${tx("s_selten",null,"p","sub")}</div>
   <div class="vars">${r.map((x,i)=>`<div class="var cpanel rv" data-rv="r${i}" data-d="${(i%4)*60}">
     <div class="mini-c${x.fx==="rainbow"?" rainbow":""}${x.fx?" foil":""}" style="--rc:${col(x.col)}"><span>${IC.hero}</span></div>
     <div class="vt"><b>${E(x.name)}</b><em>${stars(x.stars)}</em><p>${E(x.info||"")}</p>${x.oft?`<span class="oft">${E(x.oft)}</span>`:""}</div></div>`).join("")}</div>
   ${S.edit?edRar():""}</section>
  <section id="kategorien"><div class="rv" data-rv="hkat">${tx("k_katinfo",null,"span","kicker")}${tx("h_katinfo",null,"h2")}${tx("s_katinfo",null,"p","sub")}</div>
   <div class="kgrid">${C.kat.map((k,i)=>`<div class="kitem cpanel rv" data-rv="k${i}" data-d="${(i%3)*60}" style="--kc:${col(k.col)}"><b>${E(k.name)}</b>
     ${k.var?`<small>${E(T("kat_var"))}: ${E(k.var)}</small>`:""}${k.bonus!==false&&k.reward?`<small class="rw">🎁 ${E(k.reward)}</small>`:""}</div>`).join("")}</div>
   ${S.edit?edKat():""}</section>
  <section id="infos"><div class="rv" data-rv="hinfo">${tx("k_info",null,"span","kicker")}${tx("h_info",null,"h2")}</div>
   <div class="info">${C.info.map((n,i)=>`<div class="irow rv" data-rv="i${i}" data-d="${i*80}">${IC[n.ic]||IC.info}<div><small>${E(n.l)}</small><b>${E(n.t)}</b></div></div>`).join("")}</div>
   ${S.edit?edInfo():""}</section></div>`;
}
function rewardsHTML(done){
  const ks=C.kat.filter(k=>k.bonus!==false&&k.reward),all=(S.album&&S.album.cards)||[];if(!ks.length)return "";
  return `<div class="rewards"><div>${tx("k_rew",null,"span","kicker")}${tx("h_rew",null,"h2")}${tx("s_rew",null,"p","sub")}</div>
   <div class="rgrid">${ks.map(k=>{const cs=all.filter(c=>c.kat===k.id),n=cs.filter(c=>c.own).length,m=cs.length,ok=S.pl&&m&&n===m;
    return `<div class="rcard${ok?" got":""}" style="--kc:${col(k.col)}"><div class="medal">${ok?"★":IC.lock}</div><div class="rt"><b>${E(k.reward)}</b>
     <small>${ok?E(T("rew_got")):E(T("rew_open",{m:m||"?",k:k.name}))}</small>${!ok&&S.pl&&m?`<div class="bar"><i style="--p:${n/m*100}%"></i></div>`:""}</div></div>`;}).join("")}</div></div>`;
}
/* ---- Admin: Karten verwalten ---- */
function cardAdminHTML(){
  const L=S.acards,opt=v=>[...C.kat.map(k=>[k.id,k.name]),["offen","– noch ohne Kategorie –"]].map(([id,n])=>`<option value="${E(id)}"${v===id?" selected":""}>${E(n)}</option>`).join("");
  return `<details class="ed" id="edcards"${S.acOpen?" open":""}><summary><h4 style="display:inline">Karten verwalten (nur Admin)${L?` · ${L.length} Karten`:""}</h4></summary>
   <p class="hint">Hier legst du fest, welche Karte zu welcher Kategorie gehört. Der Code wird beim Anlegen automatisch zufällig erzeugt – genau dieser Code muss auf die gedruckte Karte.</p>
   ${!L?`<button class="btn sm" data-a="acload">Karten laden</button>`:`
   <div class="acnew"><input id="acn" placeholder="Name, z. B. Fr. Muster"><input id="acb" placeholder="Fächer / Bereich"><select id="ack">${opt("offen")}</select><button class="btn sm" data-a="acadd">+ Karte anlegen</button></div>
   <div class="aclist">${L.map((c,i)=>`<div class="acrow" data-i="${i}"><input data-f="name" value="${E(c.name)}"><input data-f="bereich" value="${E(c.bereich||"")}" placeholder="Fächer / Bereich">
     <select data-f="kat">${opt(c.kat)}</select><code title="Kartencode">${E(c.code)}</code><button class="mv" data-a="acsave" title="Speichern">✓</button><button class="x" data-a="acdel" title="Löschen">✕</button></div>`).join("")}</div>
   <button class="btn sm ghost" data-a="accsv">Codes als Liste herunterladen (CSV)</button>`}</details>`;
}

function go(p,push=true){
  p=PAGES.includes(p)?p:({karte:"start",selten:"infos",kategorien:"album"})[p]||"start";
  const ch=p!==S.page;S.page=p;
  if(push&&location.hash!=="#"+p)history.pushState(null,"","#"+p);
  render();if(ch)scrollTo(0,0);
  if(p==="album")loadAlbum();
}
/* ============ EREIGNISSE ============ */
document.addEventListener("click",e=>{ // Bearbeiten-Modus: Tippen auf Text öffnet Editor
  if(!S.edit)return;
  const el=e.target.closest("[data-t]");
  if(!el||e.target.closest(".modal"))return;
  e.preventDefault();e.stopPropagation();
  S.modal={type:"text",key:el.dataset.t};render();
  setTimeout(()=>{const t=$("#tval");if(t){t.focus();t.select();}},50);
},true);
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==="cform")return check();
  if(id==="lform"){S.loginErr="";
    try{await login($("#lmail").value.trim(),$("#lpw").value);S.modal=null;toast("Angemeldet ✓");}catch(er){S.loginErr=er.message;}
    return render();}
  if(id==="accform"){const btn=e.target.querySelector("[type=submit]");btn.disabled=true;S.accErr="";
    const nick=$("#anick").value,mode=S.modal.mode;
    try{await plAuth(mode,nick,$("#apw").value,($("#apw2")||{}).value);S.modal=null;toast(S.adminLogin?"Admin-Modus ✓":mode==="reg"?"Konto erstellt ✓":"Angemeldet ✓");S.adminLogin=false;
      await loadAlbum();return render();}
    catch(er){S.accErr=er.message;render();const n=$("#anick");if(n)n.value=nick;return;}}
  if(id==="delform"){S.accErr="";
    try{const ok=await rpc("player_delete",{p_token:S.pl.token,p_pw:$("#dpw").value});
      if(ok!==true)throw new Error("Passwort falsch.");
      S.modal=null;plSave(null);toast("Konto gelöscht");loadAlbum();}
    catch(er){S.accErr=er.message;}
    return render();}
  if(id==="tform"){const k=S.modal.key,old=C.t[k];C.t[k]=$("#tval").value;
    try{await saveCfg();S.modal=null;}catch(er){C.t[k]=old;alert(er.message);}return render();}
});
document.addEventListener("input",e=>{
  if(e.target.id!=="code")return;
  const v=e.target.value.replace(/\D/g,"").slice(0,6);e.target.value=v;
  if(v.length===6)check();
});
document.addEventListener("click",async e=>{
  if(e.target.closest(".ft")&&!S.edit){ // versteckter Admin-Zugang: 5× schnell auf die Fußzeile tippen
    const n=Date.now();S.taps=n-S.tapT<1500?S.taps+1:1;S.tapT=n;
    if(S.taps>=5&&!S.admin){S.taps=0;S.modal={type:"login"};S.loginErr="";render();}
    return;
  }
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="mbg"){if(e.target===b){S.modal=null;render();}return;}
  if(a==="logout")return logout();
  if(a==="mclose"){S.modal=null;return render();}
  if(a==="edit"){S.edit=!S.edit;if(!S.edit)loadCfg();return render();}
  if(a==="legal"){S.modal={type:"legal",key:b.dataset.k};return render();}
  if(a==="lsave"){const k=S.modal.key,old=C.legal[k];C.legal[k]=$("#lval").value;
    try{await saveCfg();S.modal=null;}catch(er){C.legal[k]=old;alert(er.message);}return render();}
  if(a==="treset"){$("#tval").value=DEF.t[S.modal.key]??"";return;}
  // Sammelalbum / Konto
  if(a==="go")return go(b.dataset.p);
  if(a==="acload"||a==="acadd"||a==="acsave"||a==="acdel"||a==="accsv")return cardAdmin(a,b);
  if(a==="view"){S.modal={type:"view"};return render();}
  if(a==="setview"){try{b.dataset.v==="auto"?localStorage.removeItem("jcbs-view"):localStorage.setItem("jcbs-view",b.dataset.v)}catch(e){}
    applyView();S.modal=null;render();toast(T("view_btn")+": "+viewLabel(b.dataset.v));return;}
  if(a==="acc"){S.accErr="";S.modal={type:"acc",mode:b.dataset.m||"login"};render();setTimeout(()=>{const n=$("#anick");if(n)n.focus();},50);return;}
  if(a==="accmode"){const n=$("#anick").value;S.accErr="";S.modal.mode=b.dataset.m;render();$("#anick").value=n;return;}
  if(a==="plout"){S.modal=null;plOut(true);toast("Abgemeldet");return render();}
  if(a==="card"){S.modal={type:"card",i:+b.dataset.i};render();bindTilt();return;}
  if(a==="apw"||a==="apdel"){const nick=$("#apn").value.trim();if(!nick)return alert("Bitte Nickname eingeben.");
    try{if(a==="apw"){const pw=$("#apnpw").value;if(pw.length<6)return alert("Passwort: mindestens 6 Zeichen.");
        const ok=await rpc("admin_player_pw",{p_nick:nick,p_pw:pw},true);alert(ok?`Passwort für „${nick}“ gesetzt. Bitte so weitergeben.`:"Diesen Nickname gibt es nicht.");}
      else{if(!confirm(`Konto „${nick}“ mit ganzem Album wirklich löschen?`))return;
        const ok=await rpc("admin_player_delete",{p_nick:nick},true);alert(ok?"Konto gelöscht.":"Diesen Nickname gibt es nicht.");}}
    catch(er){alert(er.message);}return;}
  // Listen (Seltenheiten, Kategorien, Infos)
  const l=b.dataset.l;
  if(l){readList(l);const row=b.closest(".er"),i=row?+row.dataset.i:-1;
    if(a==="add"){if(l==="rar")C.rar.push({id:slug("neu",C.rar),name:"Neu",col:"#ffffff",stars:1,info:"",oft:"",fx:""});
      if(l==="kat")C.kat.push({id:slug("neu",C.kat),name:"Neue Kategorie",col:"#9aa4b5",bonus:true,var:"",reward:""});
      if(l==="info")C.info.push({ic:"info",l:"Neu",t:"Text"});}
    if(a==="del"&&i>=0){if(l==="rar"&&C.rar.length<2)return alert("Mindestens eine Seltenheit muss bleiben.");
      if(confirm("Wirklich löschen?"+(l!=="info"?" Karten mit dieser ID werden dann ohne Farbe angezeigt.":"")))C[l].splice(i,1);}
    if(a==="up"&&i>0){const x=C[l][i];C[l][i]=C[l][i-1];C[l][i-1]=x;}
    if(a==="saveList"){if(l==="rar")C.rar.forEach(r=>{if(!r.id||r.id.startsWith("neu"))r.id=slug(r.name,C.rar.filter(o=>o!==r));});
      if(l==="kat")C.kat.forEach(k=>{if(!k.id||k.id.startsWith("neu"))k.id=slug(k.name,C.kat.filter(o=>o!==k));});
      b.disabled=true;try{await saveCfg();}catch(er){alert(er.message);}}
    return render();
  }
  // Bestand
  if(a==="sadd"){const g=b.dataset.g,name=prompt(g==="food"?"Name der neuen Sorte:":"Name des neuen Artikels:");if(!name)return;
    const id=slug(name,S.stock),sort=Math.max(0,...S.stock.map(x=>x.sort|0))+1;
    try{await api("/rest/v1/stock",{method:"POST",body:{id,grp:g,name,price:0,qty:0,mode:g==="food"?"approx":"exact",sort},auth:true});S.force=true;await loadStock();toast("Hinzugefügt ✓");}
    catch(er){alert(er.message);}return;}
  const box=b.closest(".ctl");if(!box)return;
  const id=box.dataset.id;b.disabled=true;
  try{
    if(a==="inc"||a==="dec")await adjust(id,a==="inc"?1:-1);
    if(a==="sdel"){if(!confirm("Artikel wirklich löschen?")){b.disabled=false;return;}
      await api("/rest/v1/stock?id=eq."+encodeURIComponent(id),{method:"DELETE",auth:true});}
    if(a==="save"){
      const g=f=>{const el=box.querySelector(`[data-f="${f}"]`);return el?el.value:null;};
      const p={qty:Math.max(0,parseInt(g("qty"),10)||0),price:Math.max(0,Math.round((parseFloat(g("price"))||0)*100)/100),mode:g("mode")==="approx"?"approx":"exact"};
      if(g("name")!==null){p.name=g("name").trim()||"Artikel";p.info=g("info").trim()||null;p.img=g("img").trim()||null;}
      await saveItem(id,p);toast("Gespeichert ✓");
    }
    S.force=true;await loadStock();
  }catch(er){alert(er.message);b.disabled=false;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){S.modal=null;render();}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadStock();loadCfg();}});

/* ============ SCHNEE ============ */
(function(){
  const c=$("#snow"),x=c.getContext("2d");
  if(RM||!SNOW)return;
  let w,h,f=[];
  const size=()=>{const d=devicePixelRatio||1;w=c.width=innerWidth*d;h=c.height=innerHeight*d;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";};
  size();addEventListener("resize",size);
  const NF=innerWidth>1000?170:120;for(let i=0;i<NF;i++)f.push({x:Math.random(),y:Math.random(),r:.7+Math.pow(Math.random(),2)*3.2,s:.0005+Math.random()*.0014,d:Math.random()*6});
  let sy=0;addEventListener("scroll",()=>{sy=scrollY},{passive:true});
  (function loop(t){
    if(!document.hidden){x.clearRect(0,0,w,h);x.fillStyle="rgba(255,255,255,.8)";const d=devicePixelRatio||1;
      for(const p of f){p.y+=p.s;if(p.y>1.02){p.y=-.02;p.x=Math.random();}
        const yy=((p.y*h-sy*d*p.r*.08)%h+h)%h;
        x.beginPath();x.arc((p.x+Math.sin(t/2200+p.d)*.015)*w,yy,p.r*d,0,7);x.fill();}}
    requestAnimationFrame(loop);
  })(0);
})();

/* ============ START ============ */
(function(){
  let cached=null;try{cached=localStorage.getItem("jcbs-cfg")}catch(e){}
  try{applyCfg(cached?JSON.parse(cached):null);S.cfgJ=cached;}catch(e){applyCfg(null);}
  try{const t=JSON.parse(localStorage.getItem("jcbs-tok")||"null");if(t){S.tok=t;
    api("/rest/v1/rpc/is_admin",{method:"POST",body:{},auth:true}).then(v=>{S.admin=v===true;if(!S.admin)logout();else render();}).catch(()=>logout());}}catch(e){}
  try{const p=JSON.parse(localStorage.getItem("jcbs-player")||"null");if(p&&p.token&&p.nick)S.pl=p;}catch(e){}
  const h=location.hash.slice(1);
  if(h==="admin"){S.modal={type:"login"};history.replaceState(null,"",location.pathname);}
  else if(h)S.page=PAGES.includes(h)?h:({karte:"start",selten:"infos",kategorien:"album"})[h]||"start";
  addEventListener("hashchange",()=>{const x=location.hash.slice(1);
    if(x==="admin"){S.modal={type:"login"};S.loginErr="";history.replaceState(null,"",location.pathname+"#"+S.page);return render();}
    go(x||"start",false);});
  applyView();render();loadStock();loadCfg();loadAlbum();
  setInterval(()=>{if(!document.hidden)loadStock();},CFG.poll);
})();
</script>
