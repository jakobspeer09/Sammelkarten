 background:repeating-conic-gradient(from 0deg,rgba(245,196,81,.22) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 60s linear infinite}

@keyframes wobble{0%{transform:scale(.6);opacity:0}20%{transform:scale(1);opacity:1}30%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}50%{transform:rotate(-8deg) scale(1.03)}60%{transform:rotate(8deg) scale(1.06)}70%{transform:rotate(-10deg) scale(1.1)}80%{transform:rotate(10deg) scale(1.14)}100%{transform:scale(1.25);filter:brightness(2.5)}}

/* ============ SUPABASE (REST) ============ */
async function api(path,{method="GET",body,auth=false,prefer}={}){
  const h={apikey:CFG.key,"Content-Type":"application/json"};
  if(auth){await ensureTok();h.Authorization="Bearer "+S.tok.access_token;}
  if(prefer)h.Prefer=prefer;
  const r=await fetch(CFG.url+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((d&&(d.message||d.error_description||d.msg))||("Fehler "+r.status));
  return d;
}
function saveTok(d){S.tok={access_token:d.access_token,refresh_token:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000};try{localStorage.setItem("jcbs-tok",JSON.stringify(S.tok))}catch(e){}}
async function ensureTok(){
  if(!S.tok)throw new Error("Nicht angemeldet");
  if(S.tok.exp-60000>Date.now())return;
  const r=await fetch(CFG.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.tok.refresh_token})});
  if(!r.ok){logout();throw new Error("Sitzung abgelaufen, bitte neu anmelden");}
  saveTok(await r.json());
}
async function login(email,pw){
  const r=await fetch(CFG.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const m=String(d.error_code||d.msg||d.error_description||d.error||"");
    throw new Error(/confirm/i.test(m)?"E-Mail ist noch nicht bestätigt":/invalid/i.test(m)?"E-Mail oder Passwort falsch":"Anmeldung fehlgeschlagen ("+(m||r.status)+")");}
  saveTok(d);
  S.admin=await api("/rest/v1/rpc/is_admin",{method:"POST",body:{},auth:true})===true;
  if(!S.admin){logout();throw new Error("Dieses Konto ist kein Admin");}
}

function status(it){
  const q=it.qty|0;
  if(q<=0)return {cls:"out",k:"st_out",sold:true};
  if(it.mode==="approx"){if(q>50)return {cls:"ok",k:"st_50"};if(q>20)return {cls:"ok",k:"st_20"};return {cls:"low",k:"st_low"};}
  return {cls:q<=10?"low":"ok",k:q===1?"st_1":"st_n",n:q};
}

   <label>Anzahl<input type="number" min="0" inputmode="numeric" value="${it.qty|0}" data-f="qty"></label>
   <label>Preis €<input type="number" min="0" step="0.1" inputmode="decimal" value="${Number(it.price)}" data-f="price"></label>
   <label>Anzeige<select data-f="mode"><option value="exact"${it.mode==="exact"?" selected":""}>genau</option><option value="approx"${it.mode==="approx"?" selected":""}>ungefähr</option></select></label>
   ${S.edit?`<label class="w">Name<input value="${E(it.name)}" data-f="name"></label>

/* ============ EFFEKTE ============ */
let fxP=[],fxOn=false;
function burst(c,n,multi){
  if(RM)return;
  const cv=$("#fx"),x=cv.getContext("2d"),d=devicePixelRatio||1;
  cv.width=innerWidth*d;cv.height=innerHeight*d;
  const card=$(".tcard"),b=card?card.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const cx=(b.left+b.width/2)*d,cy=(b.top+b.height/2)*d,pal=["#ff4d6d","#ffb84d","#f5e663","#3ddc97","#4dc3ff","#9b6bff"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(3+Math.random()*9)*d;
    fxP.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4*d,l:1,r:(2+Math.random()*4)*d,c:multi?pal[i%6]:(Math.random()<.3?"#fff":c),sq:Math.random()<.5,rot:Math.random()*6});}
  if(fxOn)return;fxOn=true;
  (function loop(){
    x.clearRect(0,0,cv.width,cv.height);
    fxP=fxP.filter(p=>p.l>0);
    for(const p of fxP){p.x+=p.vx;p.y+=p.vy;p.vy+=.25*d;p.vx*=.985;p.l-=.012;p.rot+=.2;
      x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.rot);
      if(p.sq)x.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{x.beginPath();x.arc(0,0,p.r,0,7);x.fill();}x.restore();}
    if(fxP.length)requestAnimationFrame(loop);else{fxOn=false;x.clearRect(0,0,cv.width,cv.height);}
  })();
}
function bindTilt(){
  const c=$(".tcard");if(!c||RM)return;
  const mv=e=>{const b=c.getBoundingClientRect(),px=(e.clientX-b.left)/b.width,py=(e.clientY-b.top)/b.height;
    c.classList.add("tilt");c.style.animation="none";
    c.style.transform=`perspective(700px) rotateY(${(px-.5)*24}deg) rotateX(${(.5-py)*24}deg) scale(1.03)`;
    c.style.setProperty("--mx",px*100+"%");c.style.setProperty("--my",py*100+"%");};
  const lv=()=>{c.classList.remove("tilt");c.style.transform="";if(c.classList.contains("rainbow"))c.style.animation="rot 4s linear infinite";};
  c.addEventListener("pointermove",mv);c.addEventListener("pointerleave",lv);c.addEventListener("pointerup",lv);c.addEventListener("pointercancel",lv);
}
let io=null,nio=null;
function observe(){
  if(!("IntersectionObserver"in window)||RM){document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"));return;}
  io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");S.seen.add(e.target.dataset.rv);io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll(".rv").forEach((e,i)=>{if(S.seen.has(e.dataset.rv))e.classList.add("in");else{e.style.transitionDelay=(e.dataset.d||0)+"ms";io.observe(e);}});
  nio=nio||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id));}}),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("section[id]").forEach(s=>nio.observe(s));
}

  for(let i=0;i<60;i++)f.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.9,s:.0006+Math.random()*.0012,d:Math.random()*6});
  let sy=0;addEventListener("scroll",()=>{sy=scrollY},{passive:true});
  (function loop(t){
    if(!document.hidden){x.clearRect(0,0,w,h);x.fillStyle="rgba(255,255,255,.8)";const d=devicePixelRatio||1;
      for(const p of f){p.y+=p.s;if(p.y>1.02){p.y=-.02;p.x=Math.random();}
        const yy=((p.y*h-sy*d*p.r*.08)%h+h)%h;
        x.beginPath();x.arc((p.x+Math.sin(t/2200+p.d)*.015)*w,yy,p.r*d,0,7);x.fill();}}
    requestAnimationFrame(loop);
  })(0);
})();

})();
